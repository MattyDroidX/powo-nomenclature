name: Publish reviewed distributions
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index (validate on TestPyPI first)
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require a tag matching the package version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          expected = 'refs/tags/v' + version
          if os.environ['GITHUB_REF'] != expected:
              raise SystemExit('Run this workflow on the release tag: ' + expected)
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the actual wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install "$(ls dist/*.whl)[excel]"
          mkdir wheel-test && cp -r tests wheel-test/ && cd wheel-test
          ../.wheel-venv/bin/python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
