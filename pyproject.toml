[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "powo-nomenclature"
version = "0.1.0a1"
description = "Match historical plant names to the World Checklist of Vascular Plants offline and fill POWO-style fields"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["botany", "taxonomy", "nomenclature", "herbarium", "WCVP", "POWO", "plant names", "name matching",
            "nomenclatura", "taxonomia", "taxonomía", "herbário", "herbario", "sinónimos", "nomes científicos", "nombres científicos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5,<4"]

[project.urls]
Repository = "https://github.com/MattyDroidX/powo-nomenclature"
Issues = "https://github.com/MattyDroidX/powo-nomenclature/issues"

[project.scripts]
powo-nomenclature = "powo_nomenclature.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
